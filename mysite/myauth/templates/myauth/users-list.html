{% extends 'myauth/base.html' %}

{% block title %}
Users
{% endblock %}

{% block body %}
<h1>Users</h1>

<ul>
    {% for user in users %}
        <li>
            <a href="{% url 'myauth:user-detail' pk=user.pk %}">
                {{ user.username }}
            </a>
        </li>
    {% endfor %}
</ul>

    <p>
        <a href="{% url 'myauth:about-me' %}">
            Back to my profile
        </a>
    </p>

{% endblock %}
